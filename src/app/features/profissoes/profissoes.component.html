<section class="section">
  <div class="container">
    <app-section-title
      eyebrow="Carreiras em ADS e BD"
      title="Profissões em alta na Indústria 4.0"
      subtitle="O mercado exige profissionais híbridos: técnicos, analíticos e conscientes do impacto social."
    />

    <div class="grid">
      @for (p of professions; track p.title) {
        <article class="prof-card">
          <h3>{{ p.title }}</h3>
          <p class="summary">{{ p.summary }}</p>

          <h4>Habilidades-chave</h4>
          <ul class="skills">
            @for (s of p.skills; track s) { <li>{{ s }}</li> }
          </ul>

          <div class="impact">
            <span class="impact-label">Impacto no mercado</span>
            <p>{{ p.impact }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
